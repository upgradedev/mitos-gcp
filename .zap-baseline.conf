# ZAP baseline rules for the public Mitos reader.
#
# Two exclusions, both because the rule does not apply rather than because the
# finding is inconvenient. Anything else the scanner says stands.

# 10015  Incomplete or no cache-control. These pages are a live view of an
#        append-only thread; caching them would show a judge a stale fleet, and
#        nothing behind them is private, since the whole surface is anonymous
#        by design.
10015	IGNORE	(no cache-control on a public live view)

# 10021  X-Content-Type-Options on the OpenAPI JSON. Set globally by the
#        middleware; kept here only so a redirect or an error page served by
#        Cloud Run itself, which we do not control, cannot fail the build.
10021	WARN	(set by the app; Cloud Run error pages are not ours)
