# Generated from the running FastAPI app by scripts/generate_openapi.py.
# ORG_STANDARDS #6 requires this at the repo root. CI regenerates it and
# fails if it differs from what is committed, so it cannot drift from the
# endpoints that actually exist.
components:
  schemas:
    ExecuteRequest:
      properties:
        body:
          title: Body
          type: string
        branch:
          title: Branch
          type: string
        commit:
          default: ''
          title: Commit
          type: string
        message:
          title: Message
          type: string
        nonce:
          default: ''
          title: Nonce
          type: string
        path:
          title: Path
          type: string
        repository:
          default: ''
          title: Repository
          type: string
      required:
      - path
      - body
      - message
      - branch
      title: ExecuteRequest
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    RunRequest:
      properties:
        approve:
          default: false
          title: Approve
          type: boolean
        pr:
          default: 4471
          title: Pr
          type: integer
        seed:
          default: false
          title: Seed
          type: boolean
      title: RunRequest
      type: object
    SuggestedChangeApprovalRequest:
      properties:
        run_id:
          title: Run Id
          type: string
      required:
      - run_id
      title: SuggestedChangeApprovalRequest
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
info:
  description: One image, three deployments. What differs is the service account Cloud
    Run starts it with and MITOS_ROLE, neither of which the process can change. /execute
    exists on all three deployments and refuses on two of them.
  license:
    name: MIT
    url: https://github.com/upgradedev/mitos-gcp/blob/main/LICENSE
  title: Mitos fleet API
  version: 1.0.0
openapi: 3.1.0
paths:
  /:
    get:
      description: 'The application, or a plain account of why it is not here.


        Registered whether or not the build exists, rather than only when it does.

        `openapi.yaml` is generated from these routes and CI fails on drift, and CI

        checks out a tree with no `web/dist` in it, so a route that appeared only

        when the directory did would make the committed document depend on which

        machine generated it.


        503 rather than a 200 carrying an apology. A service whose interface is

        missing is not serving that interface, and the deployed check that fetches

        this path should go red rather than pass on a page of text.'
      operationId: index__get
      responses:
        '200':
          content:
            text/html:
              schema:
                type: string
          description: Successful Response
      summary: Index
  /api/session:
    get:
      operationId: session_status_api_session_get
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Session Status Api Session Get
                type: object
          description: Successful Response
      summary: Session Status
  /api/session/logout:
    post:
      operationId: session_logout_api_session_logout_post
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Session Logout
  /api/workspace/analytics:
    get:
      operationId: workspace_analytics_api_workspace_analytics_get
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Workspace Analytics Api Workspace Analytics Get
                type: object
          description: Successful Response
      summary: Workspace Analytics
  /api/workspace/config:
    get:
      operationId: workspace_config_api_workspace_config_get
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Workspace Config Api Workspace Config Get
                type: object
          description: Successful Response
      summary: Workspace Config
  /api/workspace/suggested-changes/approve:
    post:
      operationId: approve_suggested_change_api_workspace_suggested_changes_approve_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuggestedChangeApprovalRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Approve Suggested Change Api Workspace Suggested Changes
                  Approve Post
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Approve Suggested Change
  /api/workspace/suggested-changes/{run_id}:
    get:
      description: 'Exactly what a person is being asked to approve, before they approve
        it.


        The interface offered a button and a digest and never showed the bytes. A

        content-addressed approval whose content nobody can read is a hash of

        something you took on trust, which is most of the value of addressing it

        gone.


        Readable by a reviewer as well as an owner. Reading a proposal is how a

        reviewer reviews; only pressing approve is restricted, and that asymmetry
        is

        the point rather than an oversight.'
      operationId: suggested_change_detail_api_workspace_suggested_changes__run_id__get
      parameters:
      - in: path
        name: run_id
        required: true
        schema:
          title: Run Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Suggested Change Detail Api Workspace Suggested Changes  Run
                  Id  Get
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Suggested Change Detail
  /api/workspace/thread:
    get:
      operationId: workspace_thread_api_workspace_thread_get
      parameters:
      - in: query
        name: limit
        required: false
        schema:
          default: 500
          title: Limit
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Workspace Thread Api Workspace Thread Get
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Workspace Thread
  /catalog:
    get:
      operationId: catalog_catalog_get
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Catalog Catalog Get
                type: object
          description: Successful Response
      summary: Catalog
  /config:
    get:
      description: 'The bounds, as values rather than as prose in a README.


        Both are enforced elsewhere and neither is settable from here. `read_scope`

        is what the tool layer will open and `webhook_repositories` is what the

        verifier will accept, and publishing them is the difference between a

        dashboard that says a boundary exists and one that shows you where it is.'
      operationId: config_config_get
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Config Config Get
                type: object
          description: Successful Response
      summary: Config
  /connect:
    get:
      description: 'What somebody actually does with this, in three steps.


        The base URL comes from the request rather than a constant, so the webhook

        endpoint printed on the page is the one belonging to whichever deployment

        the reader is looking at.'
      operationId: connect_page_connect_get
      responses:
        '200':
          content:
            text/html:
              schema:
                type: string
          description: Successful Response
      summary: Connect Page
  /execute:
    post:
      description: 'Perform the governed write. Writer service only.


        The role check here is not decoration: this endpoint exists on all three

        deployments because they share one image, and on two of them it refuses.

        Even if it did not, those two cannot read the deploy key.'
      operationId: execute_execute_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecuteRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Execute Execute Post
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Execute
  /fleet:
    get:
      description: 'The companions and the boundary they sit behind, which the application

        draws as one picture instead of two tables.'
      operationId: fleet_moved_fleet_get
      responses:
        '302':
          description: Successful Response
      summary: Fleet Moved
  /github/app/install:
    get:
      operationId: github_app_install_github_app_install_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Github App Install
  /github/app/manifest/callback:
    get:
      operationId: github_app_manifest_callback_github_app_manifest_callback_get
      parameters:
      - in: query
        name: code
        required: true
        schema:
          title: Code
          type: string
      - in: query
        name: state
        required: true
        schema:
          title: State
          type: string
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Github App Manifest Callback
  /github/app/new:
    get:
      description: Show the GitHub App manifest for review, then post it to GitHub.
      operationId: github_app_new_github_app_new_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Github App New
  /github/app/setup/callback:
    get:
      description: Return from GitHub installation; webhook data remains the source
        of truth.
      operationId: github_app_setup_callback_github_app_setup_callback_get
      parameters:
      - in: query
        name: installation_id
        required: true
        schema:
          title: Installation Id
          type: integer
      - in: query
        name: setup_action
        required: false
        schema:
          default: install
          title: Setup Action
          type: string
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Github App Setup Callback
  /github/app/status:
    get:
      description: Expose readiness and installation metadata, never credentials.
      operationId: github_app_status_github_app_status_get
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Github App Status Github App Status Get
                type: object
          description: Successful Response
      summary: Github App Status
  /github/auth/callback:
    get:
      operationId: github_auth_callback_github_auth_callback_get
      parameters:
      - in: query
        name: code
        required: true
        schema:
          title: Code
          type: string
      - in: query
        name: state
        required: true
        schema:
          title: State
          type: string
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Github Auth Callback
  /github/auth/login:
    get:
      operationId: github_auth_login_github_auth_login_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Github Auth Login
  /identity:
    get:
      operationId: identity_identity_get
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Identity Identity Get
                type: object
          description: Successful Response
      summary: Identity
  /metrics.json:
    get:
      description: 'The same figures the overview renders, as data.


        Added because a client that cannot fetch these has to compute them, and a

        client computing its own headline numbers is a second implementation that

        will disagree with the first. Every value here is counted from the

        provenance thread; `summarise` refuses a median under three runs rather

        than producing one.'
      operationId: metrics_json_metrics_json_get
      parameters:
      - in: query
        name: limit
        required: false
        schema:
          default: 300
          title: Limit
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Metrics Json Metrics Json Get
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Metrics Json
  /run:
    post:
      operationId: run_run_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Run
  /run/stream:
    post:
      description: 'The chore, streamed as it happens.


        Bounded like `/run`: it spends the same four model calls, and streaming

        them does not make them free.


        `/run` returns when the whole thing is finished, and with a model in the

        loop that is minutes rather than seconds: the specialists read the

        repository, and each read is a round trip. A judge who posts to it waits,

        sees nothing, and concludes it is broken. The UAT caught exactly that.


        So this streams. Every beat is flushed the moment it occurs, which is both

        the honest fix for the timeout and a better thing to watch: the reads appear

        one at a time, in the order the agent chose them.'
      operationId: run_stream_run_stream_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Run Stream
  /runs:
    get:
      description: 'What ran and where each run stopped, which the thread screen groups
        by

        run and shows in the same place.'
      operationId: runs_moved_runs_get
      responses:
        '302':
          description: Successful Response
      summary: Runs Moved
  /standards:
    get:
      description: 'What a repository fails, and what could not be decided from it.


        `?repository=owner/name` points it at real code. Without one it audits the

        demo corpus, which is what the recorded demo and every offline test use.'
      operationId: standards_page_standards_get
      parameters:
      - in: query
        name: repository
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Repository
      responses:
        '200':
          content:
            text/html:
              schema:
                type: string
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Standards Page
  /standards.json:
    get:
      operationId: standards_json_standards_json_get
      parameters:
      - in: query
        name: repository
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Repository
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Standards Json Standards Json Get
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Standards Json
  /thread:
    get:
      description: 'The demo corpus thread, and only ever that.


        This returned `ledger().all()` unfiltered, and the webhook handler appends

        the analysis of every real pull request to that same ledger. Nothing leaked

        while no real analysis had run, which is exactly why it was invisible: the

        endpoint would have started publishing repository names, findings and

        provenance for private repositories the moment the product was used for the

        first time, anonymously, to anyone.


        So it filters. An entry that names a repository belongs to somebody''s

        workspace and is served by `/api/workspace/thread`, which requires a session

        and scopes by membership. What is left here is the synthetic corpus the

        recorded demo and every offline test use, which is what this endpoint is

        for.


        Filtered rather than closed, because a judge with no account should still
        be

        able to follow a thread end to end, and that was the reason it was opened
        in

        the first place.'
      operationId: thread_thread_get
      parameters:
      - in: query
        name: limit
        required: false
        schema:
          default: 100
          title: Limit
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Thread Thread Get
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Thread
  /thread/view:
    get:
      description: 'The thread, now drawn by the application.


        This is the URL the README leads with and the one the recorded demo opens,

        so it keeps working. What it opens is the same graph over the same entries,

        fetched from /thread rather than rendered here.'
      operationId: thread_view_moved_thread_view_get
      responses:
        '302':
          description: Successful Response
      summary: Thread View Moved
  /watch:
    get:
      description: 'Proof the subscription is real, and countable.


        `wakeups` only increments when Firestore delivered a snapshot in which a

        deferral had expired. Nothing in this codebase calls the fleet to produce

        one.'
      operationId: watch_watch_get
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Watch Watch Get
                type: object
          description: Successful Response
      summary: Watch
  /webhook/github:
    post:
      description: 'The trigger. Nobody opens Mitos; this does.


        Answers immediately and works afterwards. GitHub gives a webhook ten seconds

        and disables one that keeps timing out, and this chore takes minutes with
        a

        model reading the repository, so doing the work inside the request would

        guarantee the trigger stops firing.'
      operationId: github_webhook_webhook_github_post
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Github Webhook
servers:
- description: reader, holds the Firestore query subscription
  url: https://mitos-reader-437828525303.europe-west1.run.app
- description: evaluator
  url: https://mitos-evaluator-437828525303.europe-west1.run.app
- description: writer, the only identity that can publish
  url: https://mitos-writer-437828525303.europe-west1.run.app
