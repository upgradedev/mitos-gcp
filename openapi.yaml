info:
  description: One image, three deployments. What differs is the service account Cloud
    Run starts it with and MITOS_ROLE, neither of which the process can change. /execute
    exists on all three deployments and refuses on two of them.
  license:
    name: MIT
    url: https://github.com/upgradedev/mitos-gcp/blob/main/LICENSE
  title: Mitos fleet API
  version: 1.0.0
openapi: 3.1.0
paths:
  /:
    get:
      operationId: index__get
      responses:
        '200':
          content:
            text/html:
              schema:
                type: string
          description: Successful Response
      summary: Index
  /catalog:
    get:
      operationId: catalog_catalog_get
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Catalog Catalog Get
                type: object
          description: Successful Response
      summary: Catalog
  /execute:
    post:
      description: 'Perform the governed write. Writer service only.


        The role check here is not decoration: this endpoint exists on all three

        deployments because they share one image, and on two of them it refuses.

        Even if it did not, those two cannot read the deploy key.'
      operationId: execute_execute_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecuteRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Execute Execute Post
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Execute
  /identity:
    get:
      operationId: identity_identity_get
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Identity Identity Get
                type: object
          description: Successful Response
      summary: Identity
  /run:
    post:
      operationId: run_run_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Run
  /thread:
    get:
      operationId: thread_thread_get
      parameters:
      - in: query
        name: limit
        required: false
        schema:
          default: 100
          title: Limit
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Thread Thread Get
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Thread
  /thread/view:
    get:
      description: 'The thread as the graph it is.


        The product is named for a thread you can follow back, and rendering it as

        a list asks the reader to do the walking in their head. Here a click lights

        the whole path from an outcome to the pull request that caused it.'
      operationId: thread_view_thread_view_get
      parameters:
      - in: query
        name: limit
        required: false
        schema:
          default: 300
          title: Limit
          type: integer
      responses:
        '200':
          content:
            text/html:
              schema:
                type: string
          description: Successful Response
        '422':
