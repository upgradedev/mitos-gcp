# The pyramid, run against what is actually running.
#
# CI proves the code that was pushed. It does not prove the thing that is
# serving traffic, and the gap between the two has already produced two
# incidents in this repository:
#
#   MITOS_WRITER_URL was missing from Terraform, so a rebuild would have
#   removed the governed write and every test would still have passed. Caught
#   by reading a plan, not by a check.
#
#   allUsers was bound to the writer, whose /execute publishes a body taken
#   from the request. No test looked for it, because every test read the
#   identity endpoints anonymously and expected them to answer.
#
# So this runs on a schedule as well as on demand, and it runs the same suite a
# judge can run, with no credential, plus the layers that need one.

name: Deployed

on:
  schedule:
    # Twice a day. Often enough that drift is measured in hours, rare enough
    # that it is not a load test of our own public demo.
    - cron: "17 6,18 * * *"
  workflow_dispatch:
    inputs:
      reader:
        description: "Reader base URL"
        default: "https://mitos-reader-437828525303.europe-west1.run.app"
      evaluator:
        description: "Evaluator base URL"
        default: "https://mitos-evaluator-437828525303.europe-west1.run.app"
      writer:
        description: "Writer base URL"
        default: "https://mitos-writer-437828525303.europe-west1.run.app"

permissions:
  contents: read

concurrency:
  # Two of these at once would spend the public demo's own rate limit against
  # itself and report a 429 as a failure.
  group: deployed
  cancel-in-progress: false

env:
  READER: ${{ inputs.reader || 'https://mitos-reader-437828525303.europe-west1.run.app' }}
  EVALUATOR: ${{ inputs.evaluator || 'https://mitos-evaluator-437828525303.europe-west1.run.app' }}
  WRITER: ${{ inputs.writer || 'https://mitos-writer-437828525303.europe-west1.run.app' }}

jobs:
  # Layer 1. The narrowest and the fastest: does each service still say what it
  # is, and is the contract the same shape the code expects. A failure here
  # explains every failure above it, so it runs first and the rest wait.
  contract:
    name: 1 contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: The reader answers, and answers with the shape we serve
        run: |
          set -o pipefail
          python - <<'PY'
          import json, os, urllib.request
          base = os.environ["READER"]
          def get(path):
              with urllib.request.urlopen(base + path, timeout=30) as r:
                  return r.status, json.loads(r.read())
          status, ident = get("/identity")
          assert status == 200, status
          for key in ("role", "running_as", "model", "may_call_write_tools"):
              assert key in ident, f"/identity no longer reports {key}"
          assert ident["role"] == "reader", ident["role"]
          status, cfg = get("/config")
          for key in ("read_scope", "webhook_repositories", "max_reads_per_run"):
              assert key in cfg, f"/config no longer publishes {key}"
          # Every endpoint the interface fetches. Four of these were gated
          # behind MITOS_DEMO_MODE, which was set nowhere, so they answered 404
          # in production while the app that needs them was reported as checked.
          # /catalog answered, so a narrower check passed over a dead portal.
          for path in ("/config", "/thread?limit=5", "/metrics.json",
                       "/standards.json"):
              code, _ = get(path)
              assert code == 200, f"{path} answered {code}; the interface needs it"
          status, cat = get("/catalog")
          assert cat["companions"], "the catalogue is empty"
          print(f"reader ok: {ident['running_as']}, model {ident['model']}, "
                f"{len(cat['companions'])} companions")
          PY

      # The gate this repository did not have. The fleet served 4d2390b while
      # the audited HEAD was 8b3bfcc, four merged pull requests behind, and
      # every check was green because every check read the code rather than the
      # thing running. A green suite over a stale deployment is worse than a red
      # one: it is the same signal as a correct deployment.
      - name: The running service is the commit that was audited
        run: |
          set -o pipefail
          expected=$(git rev-parse --short HEAD)
          running=$(curl -sf --max-time 60 "$READER/identity"             | python -c 'import json,sys; print(json.load(sys.stdin).get("build_sha","absent"))')
          echo "expected $expected, running $running"
          if [ "$running" = "unknown" ] || [ "$running" = "absent" ]; then
            echo "::error::the running image does not report a build sha, so it cannot be shown to be the audited one"
            exit 1
          fi
          if [ "$running" != "$expected" ]; then
            echo "::error::the deployed service is $running and this commit is $expected; the fleet is not running what was audited"
            exit 1
          fi

      - name: The OpenAPI document describes the routes that are being served
        run: |
          set -o pipefail
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          base = os.environ["READER"]
          with urllib.request.urlopen(base + "/openapi.json", timeout=30) as r:
              spec = json.loads(r.read())
          paths = set(spec.get("paths", {}))
          # Not every path, because the document is generated and would drift
          # for harmless reasons. These are the ones a judge is pointed at.
          # Rewritten when the interface became a built application. The old
          # list named /fleet and /runs, which are now redirects into it: they
          # are still in the spec, so the assertion would still pass while
          # testing something it no longer means. These are the endpoints the
          # application and a judge with curl actually depend on.
          for p in ("/", "/identity", "/config", "/thread", "/run/stream",
                    "/standards.json"):
              assert p in paths, f"{p} is served but not in the published spec"
          print(f"spec describes {len(paths)} paths")
          PY

  # Layer 2. The boundary, which is the entry's central claim and the thing
  # that was broken. Deliberately its own job so a red square says "security"
  # rather than "something".
  boundary:
    name: 2 security boundary
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: The two private services refuse a stranger
        run: |
          set -o pipefail
          for svc in "$EVALUATOR" "$WRITER"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$svc/identity")
            echo "$svc/identity -> $code"
            case "$code" in
              401|403) ;;
              *) echo "::error::$svc answered an anonymous caller with $code"; exit 1 ;;
            esac
          done

      - name: An anonymous write is refused before it is parsed
        run: |
          set -o pipefail
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            -X POST "$WRITER/execute" -H 'Content-Type: application/json' \
            -d '{"path":"docs/probe.md","body":"probe","message":"probe","branch":"main"}')
          echo "anonymous POST /execute -> $code"
          # 422 is the failure this is here to catch: it means Cloud Run let the
          # caller through and FastAPI told them which fields to send next.
          case "$code" in
            401|403) ;;
            422) echo "::error::the writer parsed an anonymous request body"; exit 1 ;;
            *) echo "::error::unexpected $code from an anonymous write"; exit 1 ;;
          esac

      - name: The public reader is public, and says it cannot write
        run: |
          set -o pipefail
          python - <<'PY'
          import json, os, urllib.request
          with urllib.request.urlopen(os.environ["READER"] + "/identity", timeout=30) as r:
              ident = json.loads(r.read())
          assert ident["may_call_write_tools"]["write_spec_repo"] is False
          cred = ident["spec_repo_write_credential"]
          assert cred["reachable"] is False, cred
          print(f"reader cannot reach the credential: {cred.get('detail')}")
          PY

      - name: A repository name that could steer a URL is refused
        run: |
          set -o pipefail
          for probe in "../../user" "a/b%23frag" "a/b%3Fx%3D1"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
              "$READER/standards.json?repository=$probe")
            echo "repository=$probe -> $code"
            test "$code" = "400" || { echo "::error::accepted $probe"; exit 1; }
          done

  # Layer 3. The journeys, which is what a judge does with it. Read-only, so it
  # spends nothing and cannot trip the demo's own rate limit.
  journeys:
    name: 3 judge journeys
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Three of the six pages this job used to grep no longer exist. The
      # interface is a built application now: every screen is the same document
      # with a different fragment, so "fetch this path and grep for a phrase
      # only that page says" cannot be written any more. Fetching four paths
      # that all return the same 400-byte shell and grepping it for a word that
      # is in every one of them is a check that passes forever.
      #
      # What is left that can genuinely be checked is below, and it is the
      # failure this change actually risks: an image built without the
      # interface in it. The service would answer 200 on every JSON endpoint
      # and serve a document pointing at a bundle that is not there.
      - name: The interface is served, and the bundle it names is really there
        run: |
          set -o pipefail
          code=$(curl -s -o /tmp/index.html -w '%{http_code}' --max-time 90 "$READER/")
          if [ "$code" != "200" ]; then
            echo "::error::/ answered $code. 503 means the image has no web/dist in it."
            cat /tmp/index.html; exit 1
          fi
          # Read out of the document, never pinned here. The file names carry a
          # content hash that changes on every build, so a hardcoded name would
          # go red on the first rebuild for a reason that is not a fault.
          js=$(grep -oE '/assets/[^"]+[.]js' /tmp/index.html | head -1)
          css=$(grep -oE '/assets/[^"]+[.]css' /tmp/index.html | head -1)
          if [ -z "$js" ] || [ -z "$css" ]; then
            echo "::error::the document at / names no script or no stylesheet"
            cat /tmp/index.html; exit 1
          fi
          fail=0
          # `javascript` rather than `application/javascript`. The service sends
          # `text/javascript`, which is the type the current specification names
          # and the one `application/javascript` was superseded by, so asserting
          # the older spelling failed a correct deployment. Matching the subtype
          # accepts both and still refuses `text/html`, which is what a missing
          # asset falling through to the app shell would look like.
          for pair in "$js:javascript" "$css:text/css"; do
            path=${pair%%:*}; want=${pair##*:}
            # Fields separated by a character curl cannot produce inside one of
            # them. `read code type size` was wrong here: the content type is
            # "text/css; charset=utf-8", which is two words, so the size landed
            # in the wrong variable and the comparison below became a shell
            # error rather than a verdict.
            info=$(curl -s -o /tmp/asset -w '%{http_code}|%{content_type}|%{size_download}' --max-time 90 "$READER$path")
            code=${info%%|*}
            size=${info##*|}
            type=$(printf '%s' "$info" | cut -d'|' -f2)
            echo "$path -> $code $type $size bytes"
            [ "$code" = "200" ] || { echo "::error::$path answered $code"; fail=1; continue; }
            case "$type" in *"$want"*) ;; *) echo "::error::$path served as $type"; fail=1 ;; esac
            # A zero-length or truncated asset is served with a 200 and breaks
            # the whole interface, so size is asserted rather than assumed.
            [ "$size" -gt 10000 ] || { echo "::error::$path is $size bytes, which is not a build"; fail=1; }
          done
          exit $fail

      # Not "every screen renders": nothing here drives a browser, and a check
      # should be named for what it proves. This proves the deployed bundle is
      # the one carrying each screen's copy, which catches a deploy that shipped
      # a stale or partial build.
      - name: The served bundle carries the copy for each of the four screens
        run: |
          set -o pipefail
          # Fetched again rather than reusing the previous step's file. Sharing
          # it looked tidy and meant that when the document changed shape this
          # step silently grepped the home page instead of the bundle, and
          # reported four missing phrases with no hint of the real cause.
          #
          # The phrases below were rewritten when the interface was replaced.
          # The old ones came from the interface before it, so the check went
          # red on a deployment that was fine, which is a check reporting its
          # own staleness as a product failure. Anchor on copy that carries
          # meaning, not on headings, so a rewording that keeps the claim keeps
          # the check.
          curl -sf --max-time 90 "$READER/" -o /tmp/index.html
          js=$(grep -oE '/assets/[^"]+[.]js' /tmp/index.html | head -1)
          test -n "$js" || { echo "::error::the document at / names no script"; exit 1; }
          curl -sf --max-time 90 "$READER$js" -o /tmp/bundle.js
          fail=0
          while IFS='|' read -r screen phrase; do
            if grep -qF "$phrase" /tmp/bundle.js; then
              echo "ok   $screen"
            else
              echo "::error::the bundle does not contain the $screen copy: $phrase"; fail=1
            fi
          done <<'SCREENS'
          value|Turn every pull request into an explainable change decision.
          policy|Schema, API, and security checks run deterministically.
          write safety|No write action is simulated or sent from the browser.
          webhook|Signatures and delivery IDs are checked server-side.
          repositories|No repository activity yet. Demo and unscoped entries are hidden.
          SCREENS
          exit $fail

      # The policy had to be widened for the bundle, and a widening nobody
      # checks is a widening that keeps going. This asserts the three directives
      # that were added and the four that must not have been dropped.
      - name: The content policy allows the bundle and the fetches, and nothing else
        run: |
          set -o pipefail
          csp=$(curl -s -D - -o /dev/null --max-time 90 "$READER/" \
                | tr -d '\r' | grep -i '^content-security-policy:')
          echo "$csp"
          test -n "$csp" || { echo "::error::/ carries no content policy at all"; exit 1; }
          fail=0
          for directive in "script-src 'self'" "style-src 'self'" "connect-src 'self'" \
                           "default-src 'none'" "base-uri 'none'" "frame-ancestors 'none'" \
                           "form-action 'self'"; do
            printf '%s' "$csp" | grep -qF "$directive" \
              || { echo "::error::the policy no longer says: $directive"; fail=1; }
          done
          # The value that turns the policy back into what the first dynamic
          # scan reported at MEDIUM.
          if printf '%s' "$csp" | grep -qF "unsafe-inline"; then
            echo "::error::unsafe-inline is back in the policy"; fail=1
          fi
          exit $fail

      # These three URLs are in the README, in the recorded demo and in merged
      # pull request comments. They render nothing now, and a redirect that
      # quietly stopped being served would 404 every one of those links.
      #
      # Asserted on the Location header rather than by following the redirect:
      # `curl -L` would fetch the application shell and any grep for a word in
      # it would pass no matter where the redirect pointed.
      - name: The three retired pages redirect into the application
        run: |
          set -o pipefail
          fail=0
          while IFS='|' read -r path target; do
            info=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' --max-time 90 "$READER$path")
            code=${info%% *}
            location=${info#* }
            echo "$path -> $code $location"
            case "$code" in 301|302|307|308) ;; *) echo "::error::$path answered $code, not a redirect"; fail=1; continue ;; esac
            case "$location" in *"$target") ;; *) echo "::error::$path redirects to $location, not $target"; fail=1 ;; esac
          done <<'MOVED'
          /thread/view|#/thread
          /runs|#/thread
          /fleet|#/boundary
          MOVED
          exit $fail

      # The two pages the application does not implement, so nothing replaced
      # them and they are still rendered by the service.
      - name: The audit and the connect page still render
        run: |
          set -o pipefail
          fail=0
          while IFS='|' read -r path phrase; do
            code=$(curl -s -o /tmp/page.html -w '%{http_code}' --max-time 90 "$READER$path")
            if [ "$code" != "200" ]; then
              echo "::error::$path answered $code"; fail=1; continue
            fi
            if grep -qF "$phrase" /tmp/page.html; then
              echo "ok   $path  ($(wc -c < /tmp/page.html) bytes)"
            else
              echo "::error::$path returned 200 but did not contain: $phrase"; fail=1
            fi
          done <<'PAGES'
          /standards|the audit
          /connect|three steps
          PAGES
          exit $fail

      - name: The GitHub App manifest is one GitHub would accept
        run: |
          set -o pipefail
          # The manifest is the only artefact here that a third party parses and
          # stores, and it is checked nowhere else in this file. It shipped with
          # every URL on http, and the failure surfaced as GitHub refusing the
          # whole thing with a message naming one field and none of the cause.
          #
          # Same module as the integration suite, so the repository and the
          # deployment cannot disagree about what a valid manifest is. Not a
          # POST to github.com: that endpoint's unauthenticated answer depends
          # on session and anti-abuse state, not on the manifest, so it makes a
          # flaky gate rather than a check.
          python scripts/check_manifest.py "$READER/github/app/new"

      - name: The manifest page is never cached
        run: |
          set -o pipefail
          # It mints a single-use state paired with a ten minute cookie. A
          # cached copy carries a state the cookie no longer matches, and that
          # failure appears at GitHub, one step after the one that caused it.
          header=$(curl -s -D - -o /dev/null --max-time 60 \
            "$READER/github/app/new" | tr -d '\r' \
            | grep -i '^cache-control:' || true)
          echo "${header:-no cache-control header}"
          case "$header" in
            *no-store*) ;;
            *) echo "::error::the manifest page is cacheable: ${header:-absent}"; exit 1 ;;
          esac

      - name: The standards audit answers, and reports what it could not decide
        run: |
          set -o pipefail
          python - <<'PY'
          import json, os, urllib.request
          with urllib.request.urlopen(
              os.environ["READER"] + "/standards.json", timeout=60
          ) as r:
              audit = json.loads(r.read())
          s = audit["summary"]
          assert s["rules"] > 0, s
          # The load-bearing property of that module: silence is never counted
          # as compliance.
          assert s["could_not_be_determined"] > 0, s
          decided = s["passed"] + s["failed"]
          assert decided + s["could_not_be_determined"] <= s["rules"], s
          print(f"{s['rules']} rules, {decided} decided, "
                f"{s['could_not_be_determined']} not")
          PY

      - name: A typo in the form is not a server error
        run: |
          set -o pipefail
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            "$READER/standards?repository=not-a-repo")
          echo "bad repository on the page -> $code"
          test "$code" = "200" || { echo "::error::a typo returned $code"; exit 1; }

  # Layer 5. A scanner pointed at the running service, which is the one kind of
  # evidence the other four cannot produce: they assert what we expected, and
  # this reports what a stranger's tool finds.
  #
  # Only the reader. The evaluator and the writer refuse anonymous callers by
  # design, so scanning them would produce a page of 403s and prove nothing.
  #
  # Baseline, not a full attack. This is a public demo on somebody's billing
  # account, and an active scan would spend the Gemini budget it is supposed to
  # be protecting.
  dast:
    name: 5 dynamic scan
    needs: journeys
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: ZAP baseline against the public reader
        run: |
          set -o pipefail
          # The official image rather than a third-party action, so the thing
          # being trusted is the one ZAP publishes.
          # World-writable, because the image runs as its own uid and the mount
          # is owned by the runner. Without it the scan completed and then could
          # not write its report, which the assertion below correctly treated as
          # having proved nothing.
          mkdir -p zap-out && chmod 777 zap-out
          # The rules file lives at the repository root and the mount is
          # `zap-out`, so ZAP looked for it inside the output directory and
          # died before scanning anything.
          cp .zap-baseline.conf zap-out/
          docker run --rm -v "$PWD/zap-out:/zap/wrk/:rw" --network host ghcr.io/zaproxy/zaproxy:2.16.1 zap-baseline.py -t "$READER" -z "-config spider.excludedUrls=.*repository=.*" -c .zap-baseline.conf -J zap.json -r zap.html -I || true
          # `-I` and `|| true` so the scan's own exit code does not decide the
          # build. What decides it is the assertion below, over the findings we
          # have looked at, because a tool that fails on informational alerts
          # gets muted and a muted scanner finds nothing.

      - name: Nothing at medium or above
        run: |
          set -o pipefail
          python - <<'PY'
          import json, sys
          from pathlib import Path

          report = Path("zap-out/zap.json")
          if not report.exists():
              sys.exit("::error::the scan produced no report, so it proved nothing")

          alerts = []
          for site in json.loads(report.read_text()).get("site", []):
              alerts += site.get("alerts", [])

          # riskcode: 0 informational, 1 low, 2 medium, 3 high.
          serious = [a for a in alerts if int(a.get("riskcode", 0)) >= 2]
          for a in sorted(alerts, key=lambda x: -int(x.get("riskcode", 0))):
              risk = ("info", "low", "MEDIUM", "HIGH")[int(a.get("riskcode", 0))]
              print(f"  {risk:8} {a.get('alert')}  ({len(a.get('instances', []))} instance(s))")

          if serious:
              print(f"::error::{len(serious)} finding(s) at medium or above")
              sys.exit(1)
          print(f"{len(alerts)} alert(s), none at medium or above")
          PY

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zap-baseline
          path: |
            zap-out/zap.html
            zap-out/zap.json
          retention-days: 14

  # Layer 4. The whole suite, the same one a judge is invited to run, against
  # the same URLs. Last because it is the slowest and it runs a real chore.
  uat:
    name: 4 judge UAT
    needs: [boundary, journeys]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: judge_uat, with no credential, exactly as published
        run: |
          set -o pipefail
          python scripts/judge_uat.py \
            --base-reader "$READER" \
            --base-evaluator "$EVALUATOR" \
            --base-writer "$WRITER" | tee /tmp/uat.txt

      - name: No check may pass by not being run
        run: |
          set -o pipefail
          # A suite that reports green while quietly skipping is worse than a
          # red one, and this repository has shipped that once already.
          if grep -q "NOT CHECKED" /tmp/uat.txt; then
            echo "::warning::some checks need a credential and were announced as not checked"
            grep "NOT CHECKED" /tmp/uat.txt
          fi
          grep -qE "^ *[0-9]+/[0-9]+ passed" /tmp/uat.txt \
            || { echo "::error::the suite printed no result line"; exit 1; }
