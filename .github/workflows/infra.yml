# Infrastructure is planned in a pipeline, never changed from a laptop.
#
# `validate` runs on every push, so a broken change is caught before anyone
# reads it. `plan` runs against the real project so the diff between what is
# written down and what actually exists is visible on a pull request, which is
# the only way to find out that somebody fixed something with gcloud at 2am.
#
# `apply` is manual on purpose. Nothing here should surprise anybody.

name: Infrastructure

on:
  push:
    paths: [infra/**, .github/workflows/infra.yml]
  pull_request:
    paths: [infra/**, .github/workflows/infra.yml]
  workflow_dispatch:
    inputs:
      action:
        description: "what to do"
        default: "plan"
        type: choice
        options: [plan, import, apply, teardown-rebuild]
      image:
        description: "Container image to deploy"
        default: "europe-west1-docker.pkg.dev/upgradegr-mitos/cloud-run-source-deploy/mitos-reader:latest"

permissions:
  contents: read

concurrency:
  # Two applies at once against one state file is how state gets corrupted.
  group: infra-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_VERSION: "1.9.8"
  PROJECT: upgradegr-mitos
  STATE_BUCKET: upgradegr-mitos-tfstate

jobs:
  validate:
    name: Format and validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # Formatting is not a style opinion here. An unformatted file means the
      # plan somebody reviewed is not the file somebody wrote.
      - name: terraform fmt
        run: terraform -chdir=infra fmt -check -diff

      # No backend, so this validates the code without touching any state or
      # needing a credential. It runs on forks too.
      - name: terraform validate
        run: |
          terraform -chdir=infra init -backend=false
          terraform -chdir=infra validate

      # The claims this repository makes out loud, asserted against the code
      # that creates them rather than against a diagram.
      - name: The infrastructure says what the README says
        run: |
          set -o pipefail
          cd infra
          grep -q 'google_secret_manager_secret_iam_member" "only_the_writer"' main.tf \
            || { echo "::error::the write credential is no longer bound to a single identity"; exit 1; }
          # Two secrets, each bound to exactly one identity. The property being
          # protected is that no secret gains a second reader, not that there is
          # only ever one secret.
          test "$(grep -c 'google_secret_manager_secret_iam_member' main.tf)" -eq 2 \
            || { echo "::error::the number of secret bindings changed; check each is still a single identity"; exit 1; }
          grep -q 'google_secret_manager_secret_iam_member" "only_the_reader"' main.tf \
            || { echo "::error::the webhook secret is no longer bound to a single identity"; exit 1; }
          grep -q 'cpu_idle = each.value != "reader"' main.tf \
            || { echo "::error::the reader may be CPU-throttled, which suspends the query subscription"; exit 1; }
          grep -q 'min_instance_count = each.value == "reader" ? 1 : 0' main.tf \
            || { echo "::error::the reader may scale to zero, so the subscription would not exist"; exit 1; }
          grep -q 'MITOS_WRITER_URL' main.tf \
            || { echo "::error::the reader would not know who to ask for a write, so it would publish nothing and still look fine"; exit 1; }
          grep -q 'attribute_condition' main.tf \
            || { echo "::error::the CI identity is assumable by any repository on GitHub"; exit 1; }
          echo "the four load-bearing settings are present"

  plan:
    name: Plan against the real project
    needs: validate
    # Only when planning is what was asked for. `plan`, `import` and
    # `teardown-rebuild` all take the same state lock, and running two of them
    # from one dispatch produces a 412 on the lock file rather than a useful
    # error. Forks are excluded because they cannot authenticate anyway.
    if: >-
      (github.event_name == 'push' ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
       (github.event_name == 'workflow_dispatch' && inputs.action == 'plan'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: google-github-actions/auth@71f986410dfbc7added4569d411d040a91dc6935 # v2.1.8
        with:
          workload_identity_provider: projects/437828525303/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: mitos-tf@upgradegr-mitos.iam.gserviceaccount.com

      - name: terraform plan
        run: |
          set -o pipefail
          terraform -chdir=infra init \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="prefix=mitos"
          terraform -chdir=infra plan -no-color \
            -var="image=${{ inputs.image || 'europe-west1-docker.pkg.dev/upgradegr-mitos/cloud-run-source-deploy/mitos-reader:latest' }}" \
            | tee /tmp/plan.txt

      # Drift is the interesting output, not the plan itself. If the code and
      # the project disagree, somebody changed something by hand.
      - name: Report drift
        run: |
          if grep -qE "^No changes\." /tmp/plan.txt; then
            echo "the project matches the code"
          else
            echo "::warning::the project and the code disagree; read the plan above"
          fi

  # Bring the hand-built platform under management, once. Everything was created
  # with gcloud before this code existed, so an empty state plans "33 to add"
  # and would try to recreate what is already running.
  import:
    name: Import the existing platform
    needs: validate
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'import'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: google-github-actions/auth@71f986410dfbc7added4569d411d040a91dc6935 # v2.1.8
        with:
          workload_identity_provider: projects/437828525303/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: mitos-tf@upgradegr-mitos.iam.gserviceaccount.com

      # Every terraform command in this job needs the variable, including
      # import, which is not obvious: import evaluates the configuration before
      # it touches state.
      - name: Import, then show what genuinely differs
        env:
          TF_VAR_image: ${{ inputs.image }}
        run: |
          set -o pipefail
          terraform -chdir=infra init             -backend-config="bucket=${STATE_BUCKET}" -backend-config="prefix=mitos"
          bash infra/import.sh
          terraform -chdir=infra plan -no-color             -var="image=${{ inputs.image }}" | tee /tmp/plan.txt
          echo "---"
          grep -E "^Plan:|^No changes" /tmp/plan.txt || true

  # The proof that "reproducible setup" is not a word in a README.
  #
  # Destroys the three Cloud Run services and rebuilds them from the code. They
  # hold no state, the URLs come back identical because a Cloud Run URL carries
  # the project number, and the ledger, the identities and the write credential
  # are deliberately untouched: destroying an audit trail to show that an audit
  # trail can be recreated is not a good trade.
  teardown-rebuild:
    name: Teardown, rebuild, and prove it
    needs: validate
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'teardown-rebuild'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - uses: google-github-actions/auth@71f986410dfbc7added4569d411d040a91dc6935 # v2.1.8
        with:
          workload_identity_provider: projects/437828525303/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: mitos-tf@upgradegr-mitos.iam.gserviceaccount.com

      - name: init
        run: |
          terraform -chdir=infra init             -backend-config="bucket=${STATE_BUCKET}" -backend-config="prefix=mitos"

      - name: The services are gone
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          set -o pipefail
          bash infra/teardown_services.sh
          # Verified rather than assumed: the URL must stop answering.
          code=$(curl -o /dev/null -s -w "%{http_code}" --max-time 30             https://mitos-reader-437828525303.europe-west1.run.app/identity || true)
          echo "reader answers with: $code"
          if [ "$code" = "200" ]; then
            echo "::error::the service still answers after a destroy, so nothing was torn down"
            exit 1
          fi

      - name: Rebuild from the code alone
        run: |
          set -o pipefail
          terraform -chdir=infra apply -auto-approve -var="image=${{ inputs.image }}"
          terraform -chdir=infra output -json

      # A rebuilt fleet that does not pass the judge suite is a rebuilt fleet
      # that does not work, whatever Terraform reported.
      - name: A judge, on the rebuilt fleet
        run: |
          set -o pipefail
          for i in $(seq 1 20); do
            curl -sf --max-time 20 https://mitos-reader-437828525303.europe-west1.run.app/identity >/dev/null && break
            echo "waiting for the fleet to come up (${i})"; sleep 15
          done
          python scripts/judge_uat.py             --base-reader    https://mitos-reader-437828525303.europe-west1.run.app             --base-evaluator https://mitos-evaluator-437828525303.europe-west1.run.app             --base-writer    https://mitos-writer-437828525303.europe-west1.run.app

  apply:
    name: Apply
    needs: validate
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: google-github-actions/auth@71f986410dfbc7added4569d411d040a91dc6935 # v2.1.8
        with:
          workload_identity_provider: projects/437828525303/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: mitos-tf@upgradegr-mitos.iam.gserviceaccount.com

      - name: terraform apply
        run: |
          set -o pipefail
          terraform -chdir=infra init \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="prefix=mitos"
          terraform -chdir=infra apply -auto-approve \
            -var="image=${{ inputs.image }}"
          terraform -chdir=infra output -json > /tmp/outputs.json
          cat /tmp/outputs.json
